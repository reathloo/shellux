name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify release source
        run: |
          go mod verify
          test -z "$(gofmt -l cmd internal tools)"
          go run ./tools/theme-pack -check
          go test ./...
          go vet ./...
          sh scripts/install_test.sh
          sh -n scripts/install.sh scripts/install-release.sh
          sh shell/shellux_test.sh
          go build -o "$RUNNER_TEMP/shellux" ./cmd/shellux
          python3 shell/profile_pty_test.py "$RUNNER_TEMP/shellux"
          python3 shell/settings_pty_test.py "$RUNNER_TEMP/shellux"
          python3 shell/mouse_pty_test.py

      - name: Publish release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
